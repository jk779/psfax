name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Validate release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          git fetch --force origin \
            "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"

          if ! git rev-parse "${TAG_NAME}^{tag}" >/dev/null 2>&1; then
            echo "Release tag ${TAG_NAME} is not annotated." >&2
            exit 1
          fi

          tag_ref="refs/tags/${TAG_NAME}"
          tag_object="$(git cat-file tag "${tag_ref}")"
          if ! grep -Eq '(^gpgsig |^-----BEGIN (PGP|SSH) SIGNATURE-----)' <<<"${tag_object}"; then
            echo "Release tag ${TAG_NAME} is not signed." >&2
            exit 1
          fi

      - name: Check and build universal binary
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          VERSION="${TAG_NAME#v}"
          make GO=go VERSION="${VERSION}" check build

      - name: Read tag message
        id: tag-message
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          subject="$(git for-each-ref "refs/tags/${TAG_NAME}" --format='%(contents:subject)')"
          git for-each-ref "refs/tags/${TAG_NAME}" --format='%(contents:body)' > release-notes.md
          delimiter="tag_message_${GITHUB_RUN_ID}"
          {
            echo "name=${TAG_NAME}: ${subject}"
            echo "body<<${delimiter}"
            cat release-notes.md
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.tag-message.outputs.name }}
          body_path: release-notes.md
          files: dist/psfax
